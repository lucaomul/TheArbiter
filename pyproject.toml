[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "the-arbiter"
version = "0.1.0"
description = "Multi-agent LLM orchestration framework for critique, iteration, and verification-aware trust."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fpdf2>=2.8",
  "openai>=1.30",
  "plotly>=5.22",
  "pypdf>=5.0",
  "python-dotenv>=1.0",
  "streamlit>=1.32",
]

[project.urls]
Homepage = "https://github.com/lucaomul/TheArbiter"
Repository = "https://github.com/lucaomul/TheArbiter"
Issues = "https://github.com/lucaomul/TheArbiter/issues"

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-mock>=3.14",
  "ruff>=0.6",
]
api = [
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "fastapi>=0.115",
  "greenlet>=3.0",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "uvicorn>=0.30",
]
chromadb = [
  "chromadb>=0.5",
]

[tool.setuptools.packages.find]
include = ["arbiter*"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"arbiter/app/streamlit_app.py" = ["E402"]
"arbiter/app/app_test.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
