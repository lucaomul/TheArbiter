[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "the-arbiter"
version = "0.1.0"
description = "Multi-agent LLM orchestration framework for critique, iteration, and verification-aware trust."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "fastapi>=0.115",
  "greenlet>=3.0",
  "plotly>=5.22",
  "streamlit>=1.32",
  "pydantic>=2.8",
  "openai>=1.30",
  "python-dotenv>=1.0",
  "sqlalchemy>=2.0",
  "chromadb>=0.5",
  "uvicorn>=0.30",
]

[tool.setuptools.packages.find]
include = ["arbiter*"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
